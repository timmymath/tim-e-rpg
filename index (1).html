<title>Tim-e RPG</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --surface: #0c0c0c;
    --surface-2: #161616;
    --text: #f2f2f2;
    --text-dim: #8a938a;
    --border: #262626;
    --pos: #39ff6a;
    --pos-ink: #001a06;
    --pos-glow: rgba(57, 255, 106, 0.55);
    --neg: #ff2b2b;
    --neg-ink: #260000;
    --neg-glow: rgba(255, 43, 43, 0.5);
    --font-display: ui-serif, Georgia, "Iowan Old Style", serif;
    --font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, Menlo, Consolas, monospace;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
  }
  button, input { font-family: inherit; }

  .app { height: 100%; display: flex; flex-direction: column; }

  .topbar {
    flex-shrink: 0;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 18px 20px 12px;
  }
  .brand {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.02em;
    text-wrap: balance;
    color: var(--text);
    text-shadow: 0 0 10px rgba(57, 255, 106, 0.35);
  }
  .date { font-size: 13px; color: var(--text-dim); }

  .level-strip { flex-shrink: 0; padding: 0 20px 14px; }
  .level-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .level-badge {
    font-family: var(--font-mono); font-weight: 800; font-size: 14px; letter-spacing: 0.06em;
    color: var(--pos); text-shadow: 0 0 8px var(--pos-glow);
  }
  .level-caption { font-size: 12px; color: var(--text-dim); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .level-track { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
  .level-fill { height: 100%; background: var(--pos); box-shadow: 0 0 8px var(--pos-glow), 0 0 18px var(--pos-glow); transition: width 0.4s ease; }

  #view {
    flex: 1;
    overflow-y: auto;
    padding: 4px 20px 28px;
    -webkit-overflow-scrolling: touch;
  }

  .tabbar {
    flex-shrink: 0;
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: 0;
    color: var(--text-dim);
    padding: 6px 2px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 10px;
  }
  .tab.active { color: var(--pos); text-shadow: 0 0 8px var(--pos-glow); }
  .tab svg { width: 22px; height: 22px; }

  .hero { padding: 10px 0 4px; }
  .hero-label {
    font-size: 13px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px;
  }
  .hero-number {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: 56px; font-weight: 800; line-height: 1;
  }

  .stat-row { display: flex; gap: 12px; padding: 16px 0 20px; }
  .stat-tile {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 14px 16px;
  }
  .stat-label {
    font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px;
  }
  .stat-value {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: 22px; font-weight: 700;
  }

  .undo-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px; margin: 10px 0 4px; font-size: 15px;
  }
  .undo-banner strong { color: var(--text); }
  .undo-banner.armed { border-color: var(--neg); background: rgba(255, 43, 43, 0.08); }
  .warn-text { font-size: 14px; color: var(--neg); flex: 1; line-height: 1.35; }
  .undo-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .undo-btn {
    background: none; border: 1px solid var(--pos); color: var(--pos);
    font-weight: 700; font-size: 14px; padding: 6px 12px; border-radius: 999px; cursor: pointer;
    flex-shrink: 0;
  }
  .undo-btn.confirm { border-color: var(--neg); color: var(--neg); }
  .undo-btn.cancel { border-color: var(--border); color: var(--text-dim); }

  .cats { display: flex; flex-direction: column; gap: 24px; margin-top: 6px; }
  .cat-title {
    font-family: var(--font-display); font-size: 14px; font-weight: 700;
    letter-spacing: 0.05em; text-transform: uppercase; margin: 0 0 10px;
    text-wrap: balance;
  }
  .cat-rows, .manage-rows { display: flex; flex-direction: column; gap: 10px; }

  .quest-row {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    padding: 14px 16px; border-radius: 14px; background: var(--surface);
    border: 1.5px solid var(--border); cursor: pointer; color: var(--text);
    appearance: none; -webkit-appearance: none;
  }
  .quest-row:active { transform: scale(0.98); }
  .quest-icon {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .quest-icon.pos { background: var(--pos); color: var(--pos-ink); box-shadow: 0 0 10px var(--pos-glow); }
  .quest-icon.neg { background: var(--neg); color: var(--neg-ink); box-shadow: 0 0 10px var(--neg-glow); }
  .quest-label { flex-grow: 1; font-size: 17px; font-weight: 500; line-height: 1.35; }
  .today-count {
    font-family: var(--font-mono); font-size: 13px; color: var(--text-dim);
    background: var(--surface-2); border-radius: 999px; padding: 2px 8px; flex-shrink: 0;
  }
  .quest-xp {
    flex-shrink: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-weight: 700; font-size: 17px;
  }
  .quest-xp.pos { color: var(--pos); text-shadow: 0 0 6px var(--pos-glow); }
  .quest-xp.neg { color: var(--neg); text-shadow: 0 0 6px var(--neg-glow); }

  .empty { color: var(--text-dim); font-size: 16px; padding: 40px 4px; text-align: center; line-height: 1.5; }

  .section-title { font-family: var(--font-display); font-size: 16px; font-weight: 700; margin: 18px 0 12px; text-wrap: balance; }

  .day-group { margin-bottom: 22px; }
  .day-header {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 10px;
  }
  .day-label { font-family: var(--font-display); font-weight: 700; font-size: 16px; }
  .day-total { font-family: var(--font-mono); font-weight: 700; font-size: 15px; }
  .day-total.pos { color: var(--pos); }
  .day-total.neg { color: var(--neg); }
  .history-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .history-time { width: 64px; flex-shrink: 0; font-size: 13px; color: var(--text-dim); font-family: var(--font-mono); }
  .history-label { flex-grow: 1; font-size: 16px; }
  .history-xp { font-family: var(--font-mono); font-weight: 700; font-size: 16px; flex-shrink: 0; }
  .history-xp.pos { color: var(--pos); }
  .history-xp.neg { color: var(--neg); }
  .history-row.armed { background: rgba(255, 43, 43, 0.08); border-radius: 10px; padding: 10px 8px; border-bottom: none; }
  .history-row.armed .warn-text { flex-grow: 1; font-size: 15px; margin: 0; }
  .icon-btn { background: none; border: 0; color: var(--text-dim); padding: 6px; cursor: pointer; display: flex; border-radius: 8px; flex-shrink: 0; }
  .icon-btn:hover { color: var(--text); }
  .icon-btn.danger:hover { color: var(--neg); }
  .icon-btn.confirm { color: var(--neg); }
  .icon-btn svg { width: 18px; height: 18px; }

  .add-form {
    display: flex; flex-direction: column; gap: 12px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 24px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text-dim); flex: 1; }
  .field-row { display: flex; gap: 12px; }
  input[type="text"], input[type="number"] {
    font-size: 16px; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; width: 100%; box-sizing: border-box;
  }
  .primary-btn {
    background: var(--pos); color: var(--pos-ink); border: 0; font-weight: 700;
    font-size: 15px; padding: 12px 16px; border-radius: 12px; cursor: pointer;
    box-shadow: 0 0 0 rgba(0, 0, 0, 0); transition: box-shadow 0.2s ease;
  }
  .primary-btn:hover, .primary-btn:focus-visible { box-shadow: 0 0 16px var(--pos-glow); }
  .danger-btn {
    background: none; border: 1.5px solid var(--neg); color: var(--neg);
    font-weight: 700; font-size: 15px; padding: 12px 16px; border-radius: 12px; cursor: pointer;
  }

  .manage-row { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; flex-wrap: wrap; }
  .manage-main { flex-grow: 1; min-width: 140px; }
  .manage-label { font-size: 16px; font-weight: 500; }
  .manage-meta { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
  .manage-row.editing input { flex: 1 1 100px; }

  .data-section { margin-bottom: 28px; }
  .hint { font-size: 14px; color: var(--text-dim); line-height: 1.5; margin: 0 0 10px; }
  .code-box {
    width: 100%; box-sizing: border-box; font-family: var(--font-mono); font-size: 12px;
    color: var(--text); background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; min-height: 140px; resize: vertical; margin-bottom: 10px;
  }
  .file-input { display: block; margin-bottom: 10px; color: var(--text-dim); font-size: 14px; }
  .copy-status { display: inline-block; margin-left: 10px; font-size: 13px; color: var(--text-dim); }
  .danger-zone { border-top: 1px solid var(--border); padding-top: 20px; }

  button:focus-visible, input:focus-visible { outline: 2px solid var(--pos); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .quest-row, .level-fill, .primary-btn { transition: none; }
  }
</style>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">Tim-e RPG</div>
    <div class="date" id="todayDate"></div>
  </header>
  <div class="level-strip" id="levelStrip"></div>
  <main id="view"></main>
  <nav class="tabbar" aria-label="Sections">
    <button class="tab" data-view="today" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
      <span>Today</span>
    </button>
    <button class="tab" data-view="history" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
      <span>History</span>
    </button>
    <button class="tab" data-view="quests" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h10"/><path d="M9 12h10"/><path d="M9 18h10"/><path d="M4.5 6l1 1 2-2"/><path d="M4.5 12l1 1 2-2"/><path d="M4.5 18l1 1 2-2"/></svg>
      <span>Quests</span>
    </button>
    <button class="tab" data-view="data" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="4" rx="1"/><path d="M5 8.5v9a2 2 0 002 2h10a2 2 0 002-2v-9"/><path d="M10 13h4"/></svg>
      <span>Data</span>
    </button>
  </nav>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "questlog.v1";
  var CATEGORY_ORDER = ["Movement", "Mind & Recovery", "Fasting", "Nutrition"];
  var UNDO_WINDOW_MS = 4500;

  var ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>';
  var ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4.2-.9L18.4 8.8a1.8 1.8 0 000-2.5l-.7-.7a1.8 1.8 0 00-2.5 0L4.9 15.8 4 20z"/></svg>';
  var ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2"/><path d="M6.5 7l.8 12a2 2 0 002 1.8h5.4a2 2 0 002-1.8l.8-12"/></svg>';
  var ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  var ICON_PLUS = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
  var ICON_MINUS = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>';

  function defaultQuests() {
    return [
      { id: "lift", label: "Lift weights", xp: 15, category: "Movement" },
      { id: "cardio", label: "Cardio", xp: 15, category: "Movement" },
      { id: "meditate", label: "Meditate", xp: 10, category: "Mind & Recovery" },
      { id: "sleep", label: "Sleep hygiene (phone out of bed)", xp: 15, category: "Mind & Recovery" },
      { id: "fast12", label: "Fasted 12h+", xp: 10, category: "Fasting" },
      { id: "fast14", label: "Fasted 14h+", xp: 5, category: "Fasting" },
      { id: "fast16", label: "Fasted 16h+", xp: 5, category: "Fasting" },
      { id: "fast18", label: "Fasted 18h+", xp: 10, category: "Fasting" },
      { id: "wholefood", label: "Whole-food, plant-forward meal", xp: 10, category: "Nutrition" },
      { id: "protein", label: "Included a lean protein source", xp: 5, category: "Nutrition" },
      { id: "seated", label: "Ate seated, no screen", xp: 5, category: "Nutrition" },
      { id: "hunger", label: "Hunger check-in before eating", xp: 10, category: "Nutrition" },
      { id: "water", label: "Glass of water before eating", xp: 5, category: "Nutrition" },
      { id: "dairy", label: "Ate dairy", xp: -15, category: "Nutrition" },
      { id: "sugar", label: "Ate processed sugar", xp: -15, category: "Nutrition" }
    ];
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.quests) || !Array.isArray(parsed.entries)) return null;
      return parsed;
    } catch (e) { return null; }
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  var state = loadState() || { quests: defaultQuests(), entries: [] };
  var currentView = "today";
  var editingQuestId = null;
  var lastEntry = null;
  var resetArmed = false;
  var resetTimer = null;
  var armedActions = {};

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function dayKey(ts) {
    var d = new Date(ts);
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function startOfDay(ts) {
    var d = new Date(ts);
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }

  function computeStats() {
    var now = Date.now();
    var todayK = dayKey(now);
    var todayXP = 0, totalXP = 0, weekXP = 0;
    var weekStart = startOfDay(now) - 6 * 86400000;
    state.entries.forEach(function (e) {
      totalXP += e.xp;
      if (dayKey(e.ts) === todayK) todayXP += e.xp;
      if (e.ts >= weekStart) weekXP += e.xp;
    });
    return { todayXP: todayXP, weekAvg: Math.round(weekXP / 7), totalXP: totalXP };
  }

  function todayCounts() {
    var todayK = dayKey(Date.now());
    var counts = {};
    state.entries.forEach(function (e) {
      if (dayKey(e.ts) === todayK) counts[e.questId] = (counts[e.questId] || 0) + 1;
    });
    return counts;
  }

  function todaysEntries() {
    var todayK = dayKey(Date.now());
    return state.entries
      .filter(function (e) { return dayKey(e.ts) === todayK; })
      .slice()
      .sort(function (a, b) { return b.ts - a.ts; });
  }

  // Level curve: level L needs (150 + 30*(L-1)) XP to reach L+1 (L1->2 needs 150, L2->3 needs 180, L3->4 needs 210, ...).
  // Grows gently on purpose so leveling stays meaningful over months of use instead of stalling out.
  function levelInfo(totalXPRaw) {
    var xp = Math.max(0, totalXPRaw);
    var level = 1;
    var into = xp;
    var needed = 150;
    while (into >= needed) {
      into -= needed;
      level++;
      needed = 150 + 30 * (level - 1);
    }
    return { level: level, into: into, needed: needed, pct: Math.min(100, Math.round((into / needed) * 100)) };
  }

  function categorizedQuests() {
    var groups = {};
    state.quests.forEach(function (q) {
      var cat = q.category || "Other";
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(q);
    });
    var names = CATEGORY_ORDER.filter(function (c) { return groups[c]; });
    Object.keys(groups).forEach(function (c) { if (names.indexOf(c) === -1) names.push(c); });
    return names.map(function (name) { return { name: name, quests: groups[name] }; });
  }

  function groupedHistory() {
    var days = {};
    state.entries.forEach(function (e) {
      var k = dayKey(e.ts);
      if (!days[k]) days[k] = [];
      days[k].push(e);
    });
    var keys = Object.keys(days).sort(function (a, b) { return b.localeCompare(a); });
    return keys.map(function (k) {
      var list = days[k].slice().sort(function (a, b) { return b.ts - a.ts; });
      var total = list.reduce(function (s, e) { return s + e.xp; }, 0);
      return { date: k, entries: list, total: total };
    });
  }

  function dayLabel(dateStr) {
    var todayK = dayKey(Date.now());
    var yestK = dayKey(Date.now() - 86400000);
    if (dateStr === todayK) return "Today";
    if (dateStr === yestK) return "Yesterday";
    var d = new Date(dateStr + "T00:00:00");
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }

  function timeLabel(ts) {
    return new Date(ts).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  function completeQuest(questId) {
    var q = state.quests.find(function (x) { return x.id === questId; });
    if (!q) return;
    var entry = { id: uid(), questId: q.id, label: q.label, xp: q.xp, ts: Date.now() };
    state.entries.push(entry);
    lastEntry = entry;
    delete armedActions["undo-last"];
    saveState();
    render();
  }

  function undoLast() {
    if (!lastEntry) return;
    state.entries = state.entries.filter(function (e) { return e.id !== lastEntry.id; });
    lastEntry = null;
    saveState();
    render();
  }

  function deleteEntry(id) {
    state.entries = state.entries.filter(function (e) { return e.id !== id; });
    if (lastEntry && lastEntry.id === id) lastEntry = null;
    saveState();
    render();
  }

  function addQuest(label, xp, category) {
    state.quests.push({ id: uid(), label: label, xp: xp, category: category });
    saveState();
    render();
  }

  function updateQuest(id, fields) {
    var q = state.quests.find(function (x) { return x.id === id; });
    if (!q) return;
    Object.assign(q, fields);
    saveState();
    render();
  }

  function deleteQuest(id) {
    state.quests = state.quests.filter(function (x) { return x.id !== id; });
    saveState();
    render();
  }

  function importFromJsonString(str) {
    try {
      var parsed = JSON.parse(str);
      if (!parsed || !Array.isArray(parsed.quests) || !Array.isArray(parsed.entries)) throw new Error("bad shape");
      var addedQuests = 0, addedEntries = 0;
      var existingQuestIds = {};
      state.quests.forEach(function (q) { existingQuestIds[q.id] = true; });
      parsed.quests.forEach(function (q) {
        if (q && q.id && !existingQuestIds[q.id]) {
          state.quests.push({ id: q.id, label: String(q.label || "Untitled"), xp: Number(q.xp) || 0, category: String(q.category || "Other") });
          existingQuestIds[q.id] = true;
          addedQuests++;
        }
      });
      var existingEntryIds = {};
      state.entries.forEach(function (e) { existingEntryIds[e.id] = true; });
      parsed.entries.forEach(function (e) {
        if (e && e.id && !existingEntryIds[e.id]) {
          state.entries.push({ id: e.id, questId: e.questId, label: String(e.label || ""), xp: Number(e.xp) || 0, ts: Number(e.ts) || Date.now() });
          existingEntryIds[e.id] = true;
          addedEntries++;
        }
      });
      saveState();
      render();
      setTimeout(function () {
        var status = document.getElementById("importStatus");
        if (status) status.textContent = "Added " + addedQuests + " quest(s) and " + addedEntries + " entr" + (addedEntries === 1 ? "y" : "ies") + ".";
      }, 0);
    } catch (err) {
      render();
      setTimeout(function () {
        var status = document.getElementById("importStatus");
        if (status) status.textContent = "That did not look like a valid export. Nothing was changed.";
      }, 0);
    }
  }

  function copyExport() {
    var box = document.getElementById("exportBox");
    var status = document.getElementById("copyStatus");
    var text = box.value;
    function fail() {
      box.focus();
      box.select();
      if (status) status.textContent = "Copied the selection instead - use your keyboard to copy it.";
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        if (status) status.textContent = "Copied.";
      }).catch(fail);
    } else {
      fail();
    }
  }

  function handleResetClick(btn) {
    if (!resetArmed) {
      resetArmed = true;
      btn.textContent = "Tap again to confirm";
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function () {
        resetArmed = false;
        if (btn.isConnected) btn.textContent = "Reset app";
      }, 4000);
    } else {
      resetArmed = false;
      clearTimeout(resetTimer);
      state = { quests: defaultQuests(), entries: [] };
      lastEntry = null;
      saveState();
      render();
    }
  }

  function renderLevelStrip() {
    var stats = computeStats();
    var lvl = levelInfo(stats.totalXP);
    return (
      '<div class="level-top"><span class="level-badge">LV ' + lvl.level + '</span>' +
      '<span class="level-caption">' + lvl.into + " / " + lvl.needed + ' XP to next level</span></div>' +
      '<div class="level-track"><div class="level-fill" style="width:' + lvl.pct + '%"></div></div>'
    );
  }

  function renderEntryRow(e) {
    var armedKey = "entry:" + e.id;
    var sign = e.xp > 0 ? "+" : "";
    var tone = e.xp >= 0 ? "pos" : "neg";
    if (armedActions[armedKey]) {
      return (
        '<div class="history-row armed"><div class="warn-text">Delete this entry for good?</div>' +
        '<button class="icon-btn confirm" data-action="delete-entry" data-id="' + e.id + '" type="button" aria-label="Confirm delete">' + ICON_CHECK + "</button>" +
        '<button class="icon-btn" data-action="cancel-delete-entry" data-id="' + e.id + '" type="button" aria-label="Cancel">' + ICON_X + "</button></div>"
      );
    }
    return (
      '<div class="history-row"><div class="history-time">' + timeLabel(e.ts) + "</div>" +
      '<div class="history-label">' + escapeHtml(e.label) + "</div>" +
      '<div class="history-xp ' + tone + '">' + sign + e.xp + "</div>" +
      '<button class="icon-btn" data-action="delete-entry" data-id="' + e.id + '" type="button" aria-label="Delete entry">' + ICON_X + "</button></div>"
    );
  }

  function renderToday() {
    var stats = computeStats();
    var counts = todayCounts();
    var cats = categorizedQuests();
    var log = todaysEntries();

    var banner = "";
    if (lastEntry) {
      if (armedActions["undo-last"]) {
        banner = (
          '<div class="undo-banner armed"><span class="warn-text">Remove "' + escapeHtml(lastEntry.label) + '" (' +
          (lastEntry.xp > 0 ? "+" : "") + lastEntry.xp + " XP)? This can't be undone once confirmed.</span>" +
          '<span class="undo-actions"><button class="undo-btn confirm" data-action="undo-last" type="button">Confirm</button>' +
          '<button class="undo-btn cancel" data-action="cancel-undo" type="button">Cancel</button></span></div>'
        );
      } else {
        banner = (
          '<div class="undo-banner"><span>Logged <strong>' + escapeHtml(lastEntry.label) + "</strong> " +
          (lastEntry.xp > 0 ? "+" : "") + lastEntry.xp + ' XP</span><button class="undo-btn" data-action="undo-last" type="button">Undo</button></div>'
        );
      }
    }

    var heroColor = stats.todayXP >= 0 ? "var(--pos)" : "var(--neg)";
    var heroGlow = stats.todayXP >= 0 ? "var(--pos-glow)" : "var(--neg-glow)";
    var heroLabel = (stats.todayXP > 0 ? "+" : "") + stats.todayXP;

    var catsHtml = cats.map(function (cat) {
      var rows = cat.quests.map(function (q) {
        var n = counts[q.id] || 0;
        var positive = q.xp >= 0;
        var tone = positive ? "pos" : "neg";
        var sign = q.xp > 0 ? "+" : "";
        var badge = n > 0 ? '<span class="today-count">×' + n + "</span>" : "";
        return (
          '<button class="quest-row" data-action="complete" data-id="' + q.id + '" type="button">' +
          '<span class="quest-icon ' + tone + '">' + (positive ? ICON_PLUS : ICON_MINUS) + "</span>" +
          '<span class="quest-label">' + escapeHtml(q.label) + "</span>" +
          badge +
          '<span class="quest-xp ' + tone + '">' + sign + q.xp + "</span>" +
          "</button>"
        );
      }).join("");
      return '<section class="cat-group"><h2 class="cat-title">' + escapeHtml(cat.name) + '</h2><div class="cat-rows">' + rows + "</div></section>";
    }).join("");

    var logHtml = log.length
      ? '<section class="day-group"><h2 class="section-title" style="margin-top:0;">Today’s log</h2><div class="day-entries">' + log.map(renderEntryRow).join("") + "</div></section>"
      : "";

    return (
      banner +
      '<div class="hero"><div class="hero-label">XP Today</div><div class="hero-number" style="color:' + heroColor + '; text-shadow:0 0 14px ' + heroGlow + ', 0 0 30px ' + heroGlow + ';">' + heroLabel + "</div></div>" +
      '<div class="stat-row">' +
      '<div class="stat-tile"><div class="stat-label">Avg / day · 7d</div><div class="stat-value">' + stats.weekAvg + "</div></div>" +
      '<div class="stat-tile"><div class="stat-label">Total XP</div><div class="stat-value">' + stats.totalXP.toLocaleString() + "</div></div>" +
      "</div>" +
      '<div class="cats">' + catsHtml + "</div>" +
      logHtml
    );
  }

  function renderHistory() {
    var days = groupedHistory();
    if (days.length === 0) {
      return '<div class="empty">No quests logged yet. Head to Today and tap a quest to get started.</div>';
    }
    return days.map(function (day) {
      var totalSign = day.total > 0 ? "+" : "";
      var totalTone = day.total >= 0 ? "pos" : "neg";
      return (
        '<section class="day-group"><div class="day-header"><span class="day-label">' + dayLabel(day.date) +
        '</span><span class="day-total ' + totalTone + '">' + totalSign + day.total + " XP</span></div>" +
        '<div class="day-entries">' + day.entries.map(renderEntryRow).join("") + "</div></section>"
      );
    }).join("");
  }

  function renderQuests() {
    var cats = categorizedQuests();
    var catNames = cats.map(function (c) { return c.name; });

    var catsHtml = cats.map(function (cat) {
      var rows = cat.quests.map(function (q) {
        if (editingQuestId === q.id) {
          return (
            '<div class="manage-row editing" data-id="' + q.id + '">' +
            '<input type="text" class="edit-label" value="' + escapeHtml(q.label) + '" maxlength="60">' +
            '<input type="number" class="edit-xp" value="' + q.xp + '" step="1">' +
            '<input type="text" class="edit-category" value="' + escapeHtml(q.category) + '">' +
            '<button class="icon-btn" data-action="save-quest" data-id="' + q.id + '" type="button" aria-label="Save">' + ICON_CHECK + "</button>" +
            '<button class="icon-btn" data-action="cancel-edit" type="button" aria-label="Cancel">' + ICON_X + "</button>" +
            "</div>"
          );
        }
        return (
          '<div class="manage-row" data-id="' + q.id + '">' +
          '<div class="manage-main"><div class="manage-label">' + escapeHtml(q.label) + '</div>' +
          '<div class="manage-meta">' + (q.xp > 0 ? "+" : "") + q.xp + " XP · " + escapeHtml(q.category) + "</div></div>" +
          '<button class="icon-btn" data-action="edit-quest" data-id="' + q.id + '" type="button" aria-label="Edit quest">' + ICON_EDIT + "</button>" +
          '<button class="icon-btn danger" data-action="delete-quest" data-id="' + q.id + '" type="button" aria-label="Delete quest">' + ICON_TRASH + "</button>" +
          "</div>"
        );
      }).join("");
      return '<section class="cat-group"><h2 class="cat-title">' + escapeHtml(cat.name) + '</h2><div class="manage-rows">' + rows + "</div></section>";
    }).join("");

    var datalist = catNames.map(function (c) { return '<option value="' + escapeHtml(c) + '">'; }).join("");

    return (
      '<form id="addQuestForm" class="add-form">' +
      '<h2 class="section-title" style="margin-top:2px;">Add a quest</h2>' +
      '<label class="field"><span>Name</span><input type="text" id="newQuestLabel" required maxlength="60" placeholder="e.g. Stretch"></label>' +
      '<div class="field-row">' +
      '<label class="field"><span>XP</span><input type="number" id="newQuestXp" required step="1" placeholder="10"></label>' +
      '<label class="field"><span>Category</span><input type="text" id="newQuestCategory" list="catList" required placeholder="Movement">' +
      '<datalist id="catList">' + datalist + "</datalist></label>" +
      "</div>" +
      '<button type="submit" class="primary-btn">Add quest</button>' +
      "</form>" +
      '<div class="cats">' + catsHtml + "</div>"
    );
  }

  function renderData() {
    var json = JSON.stringify(state, null, 2);
    return (
      '<section class="data-section"><h2 class="section-title" style="margin-top:2px;">Export</h2>' +
      '<p class="hint">Copy this and save it somewhere safe. You can paste it back in below to restore it.</p>' +
      '<textarea id="exportBox" class="code-box" readonly>' + escapeHtml(json) + "</textarea>" +
      '<button class="primary-btn" data-action="copy-export" type="button">Copy to clipboard</button>' +
      '<span id="copyStatus" class="copy-status" aria-live="polite"></span>' +
      "</section>" +
      '<section class="data-section"><h2 class="section-title">Import</h2>' +
      '<p class="hint">Upload a previously exported file, or paste its contents below. Existing quests and history are kept as they are.</p>' +
      '<input type="file" id="importFile" accept="application/json,.json,.txt" class="file-input">' +
      '<textarea id="importBox" class="code-box" placeholder="Paste exported JSON here"></textarea>' +
      '<button class="primary-btn" data-action="import-text" type="button">Import</button>' +
      '<span id="importStatus" class="copy-status" aria-live="polite"></span>' +
      "</section>" +
      '<section class="data-section danger-zone"><h2 class="section-title" style="margin-top:0;">Reset</h2>' +
      '<p class="hint">Clears all quests and history on this device and restores the starting quest list.</p>' +
      '<button class="danger-btn" data-action="reset-all" type="button">Reset app</button>' +
      "</section>"
    );
  }

  function render() {
    var dateEl = document.getElementById("todayDate");
    if (dateEl) dateEl.textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

    var stripEl = document.getElementById("levelStrip");
    if (stripEl) stripEl.innerHTML = renderLevelStrip();

    document.querySelectorAll(".tab").forEach(function (btn) {
      var active = btn.dataset.view === currentView;
      btn.classList.toggle("active", active);
    });

    var view = document.getElementById("view");
    if (currentView === "today") view.innerHTML = renderToday();
    else if (currentView === "history") view.innerHTML = renderHistory();
    else if (currentView === "quests") view.innerHTML = renderQuests();
    else if (currentView === "data") view.innerHTML = renderData();
  }

  function onClick(e) {
    var tabBtn = e.target.closest(".tab");
    if (tabBtn) {
      currentView = tabBtn.dataset.view;
      editingQuestId = null;
      render();
      return;
    }

    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    var action = btn.dataset.action;
    var id = btn.dataset.id;

    if (action === "complete") completeQuest(id);
    else if (action === "undo-last") {
      if (armedActions["undo-last"]) {
        clearTimeout(armedActions["undo-last"]);
        delete armedActions["undo-last"];
        undoLast();
      } else {
        armedActions["undo-last"] = setTimeout(function () { delete armedActions["undo-last"]; render(); }, UNDO_WINDOW_MS);
        render();
      }
    }
    else if (action === "cancel-undo") {
      if (armedActions["undo-last"]) { clearTimeout(armedActions["undo-last"]); delete armedActions["undo-last"]; }
      render();
    }
    else if (action === "delete-entry") {
      var key = "entry:" + id;
      if (armedActions[key]) {
        clearTimeout(armedActions[key]);
        delete armedActions[key];
        deleteEntry(id);
      } else {
        armedActions[key] = setTimeout(function () { delete armedActions[key]; render(); }, UNDO_WINDOW_MS);
        render();
      }
    }
    else if (action === "cancel-delete-entry") {
      var key2 = "entry:" + id;
      if (armedActions[key2]) { clearTimeout(armedActions[key2]); delete armedActions[key2]; }
      render();
    }
    else if (action === "edit-quest") { editingQuestId = id; render(); }
    else if (action === "cancel-edit") { editingQuestId = null; render(); }
    else if (action === "save-quest") {
      var row = btn.closest(".manage-row");
      var label = row.querySelector(".edit-label").value.trim();
      var xp = parseInt(row.querySelector(".edit-xp").value, 10);
      var category = row.querySelector(".edit-category").value.trim();
      if (label && !Number.isNaN(xp) && category) {
        updateQuest(id, { label: label, xp: xp, category: category });
        editingQuestId = null;
      }
    }
    else if (action === "delete-quest") deleteQuest(id);
    else if (action === "copy-export") copyExport();
    else if (action === "import-text") {
      var box = document.getElementById("importBox");
      if (box && box.value.trim()) importFromJsonString(box.value);
    }
    else if (action === "reset-all") handleResetClick(btn);
  }

  function onSubmit(e) {
    if (e.target.id === "addQuestForm") {
      e.preventDefault();
      var label = document.getElementById("newQuestLabel").value.trim();
      var xp = parseInt(document.getElementById("newQuestXp").value, 10);
      var category = document.getElementById("newQuestCategory").value.trim();
      if (label && !Number.isNaN(xp) && category) addQuest(label, xp, category);
    }
  }

  function onChange(e) {
    if (e.target.id === "importFile") {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        importFromJsonString(String(reader.result));
        e.target.value = "";
      };
      reader.readAsText(file);
    }
  }

  document.addEventListener("click", onClick);
  document.addEventListener("submit", onSubmit);
  document.addEventListener("change", onChange);

  render();
})();
</script>
