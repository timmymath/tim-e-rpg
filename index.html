<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tim-e RPG</title>
<style>
  :root {
    --bg: #05070a;
    --bg-panel: #0b0f0c;
    --good: #39ff14;
    --good-dim: #1f8f0c;
    --good-glow: rgba(57, 255, 20, 0.3);
    --bad: #ff3b3b;
    --bad-dim: #8a1f1f;
    --bad-glow: rgba(255, 59, 59, 0.3);
    --purple: #a855f7;
    --purple-dim: #4c1d7a;
    --purple-glow: rgba(168, 85, 247, 0.4);
    --text: #d9ffdb;
    --text-dim: #6fae72;
    --border: #143312;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(168,85,247,0.08), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(57,255,20,0.05), transparent 45%);
    color: var(--text);
    font-family: 'Courier New', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 28px 16px 48px;
  }
  .app {
    width: 100%;
    max-width: 640px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
    margin-bottom: 22px;
  }
  h1 {
    font-size: 1.5rem;
    letter-spacing: 0.04em;
    margin: 0;
    color: var(--purple);
    text-shadow: 0 0 10px var(--purple-glow);
    font-weight: 700;
  }
  h1 .dash { color: var(--text-dim); font-weight: 400; }
  .day-tag {
    font-size: 0.7rem;
    color: var(--text-dim);
  }

  .streak-panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    padding: 12px 16px;
    margin-bottom: 24px;
  }
  .streak-stats {
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  .stat-block { text-align: left; }
  .stat-block.right { text-align: right; }
  .stat-value {
    display: block;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--purple);
  }
  .streak-panel.broken .stat-value.streak { color: var(--text-dim); }
  .stat-label { font-size: 0.65rem; color: var(--text-dim); }
  .streak-caption { display: block; color: var(--text-dim); font-size: 0.68rem; margin-top: 8px; }

  .status-panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .status-row:last-child { margin-bottom: 0; }
  .level { font-size: 1.1rem; color: var(--purple); }
  .xp-total { font-size: 0.85rem; color: var(--purple); }
  .bar-track {
    width: 100%;
    height: 10px;
    background: #0a0912;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--purple-dim), var(--purple));
    box-shadow: 0 0 8px var(--purple-glow);
    transition: width 0.4s ease;
  }
  .bar-caption {
    font-size: 0.65rem;
    color: var(--text-dim);
    margin-top: 6px;
    display: flex;
    justify-content: space-between;
  }

  section.quests { margin-bottom: 26px; }
  .section-label {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--border);
  }
  .section-label.good { color: var(--good); }
  .section-label.bad { color: var(--bad); }

  .sub-label {
    font-size: 0.65rem;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin: 14px 0 8px;
  }
  .sub-label:first-of-type { margin-top: 0; }

  .quest-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media (max-width: 420px) {
    .quest-grid { grid-template-columns: 1fr; }
  }

  button.quest {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 0.85rem;
    text-align: left;
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.05s ease, opacity 0.15s ease;
    width: 100%;
  }
  button.quest .quest-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: 8px;
  }
  button.quest:active:not(:disabled) { transform: scale(0.98); }
  button.quest .xp-tag { font-size: 0.75rem; white-space: nowrap; flex-shrink: 0; }
  button.quest .freq-tag { font-size: 0.62rem; color: var(--text-dim); }
  button.quest.good:hover { border-color: var(--good-dim); }
  button.quest.good .xp-tag { color: var(--good); }
  button.quest.bad:hover { border-color: var(--bad-dim); }
  button.quest.bad .xp-tag { color: var(--bad); }
  button.quest.good.done { border-color: var(--good-dim); box-shadow: 0 0 6px var(--good-glow) inset; }
  button.quest.bad.done { border-color: var(--bad-dim); }
  button.quest:disabled { opacity: 0.45; cursor: not-allowed; }
  button.quest .done-count { font-size: 0.7rem; color: var(--text-dim); margin-left: 6px; }

  .log-panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .log-panel h2 {
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 0 0 10px;
    font-weight: 400;
  }
  .log-list { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow-y: auto; font-size: 0.8rem; }
  .log-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }
  .log-list li:last-child { border-bottom: none; }
  .log-empty { color: var(--text-dim); font-size: 0.8rem; }
  .log-left { min-width: 0; overflow: hidden; }
  .log-label { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log-tag {
    display: inline-block;
    margin-top: 2px;
    font-size: 0.62rem;
    color: var(--purple);
    border: 1px solid var(--purple-dim);
    padding: 1px 5px;
  }
  .log-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .log-xp.pos { color: var(--good); }
  .log-xp.neg { color: var(--bad); }
  .log-time { color: var(--text-dim); font-size: 0.7rem; }
  .undo-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 0.65rem;
    padding: 3px 7px;
    cursor: pointer;
  }
  .undo-btn:hover { color: var(--bad); border-color: var(--bad-dim); }
  .undo-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .data-panel {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .data-btn {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 0.68rem;
    padding: 7px 12px;
    cursor: pointer;
  }
  .data-btn:hover { color: var(--purple); border-color: var(--purple-dim); }
  .data-status { text-align: center; font-size: 0.65rem; color: var(--text-dim); min-height: 14px; margin-bottom: 8px; }

  .reset-row { text-align: center; margin-top: 6px; }
  .reset-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 0.7rem;
    text-decoration: underline;
    cursor: pointer;
  }
  .reset-btn:hover { color: var(--bad); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .modal-overlay.hidden { display: none; }
  .modal-box {
    background: var(--bg-panel);
    border: 1px solid var(--purple-dim);
    box-shadow: 0 0 20px var(--purple-glow);
    padding: 20px;
    width: 100%;
    max-width: 380px;
  }
  .modal-box h3 {
    margin: 0 0 6px;
    color: var(--bad);
    font-size: 1rem;
  }
  .modal-sub { font-size: 0.72rem; color: var(--text-dim); margin: 0 0 14px; }
  .modal-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .tag-chip {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 0.72rem;
    padding: 6px 10px;
    cursor: pointer;
  }
  .tag-chip.selected { border-color: var(--purple); color: var(--purple); }
  .modal-note {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 0.8rem;
    padding: 8px;
    resize: vertical;
    min-height: 50px;
    margin-bottom: 14px;
  }
  .modal-actions { display: flex; justify-content: space-between; gap: 10px; }
  .modal-btn {
    flex: 1;
    font-family: inherit;
    font-size: 0.78rem;
    padding: 9px 10px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-dim);
  }
  .modal-btn.primary { border-color: var(--bad-dim); color: var(--bad); }
  .modal-btn.primary:hover { background: var(--bad-dim); color: var(--text); }
  .modal-btn:hover { color: var(--text); }
  .modal-close {
    display: block;
    margin: 0 0 10px auto;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 0.9rem;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Tim-e RPG</h1>
    <span class="day-tag" id="dayTag"></span>
  </header>

  <div class="streak-panel" id="streakPanel">
    <div class="streak-stats">
      <div class="stat-block">
        <span class="stat-value streak" id="streakValue">0</span>
        <span class="stat-label">day streak</span>
      </div>
      <div class="stat-block right">
        <span class="stat-value" id="avgWeekValue">0</span>
        <span class="stat-label">avg XP / day (7d)</span>
      </div>
    </div>
    <span class="streak-caption" id="streakCaption"></span>
  </div>

  <div class="status-panel">
    <div class="status-row">
      <span class="level" id="levelLabel">Level 1</span>
      <span class="xp-total" id="xpTotalLabel">0 total XP</span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
    <div class="bar-caption">
      <span id="barCurrent">0 / 100</span>
      <span id="barToNext">100 to next level</span>
    </div>
  </div>

  <section class="quests">
    <div class="section-label good">GOOD QUESTS</div>
    <div class="sub-label">Daily habits &mdash; once per day</div>
    <div class="quest-grid" id="goodDailyGrid"></div>
    <div class="sub-label">Anytime &mdash; no limit</div>
    <div class="quest-grid" id="goodAnytimeGrid"></div>
  </section>

  <section class="quests">
    <div class="section-label bad">BAD QUESTS</div>
    <div class="quest-grid" id="badGrid"></div>
  </section>

  <div class="log-panel">
    <h2>TODAY'S LOG</h2>
    <ul class="log-list" id="logList"></ul>
  </div>

  <div class="data-panel">
    <button class="data-btn" id="exportBtn">export data</button>
    <button class="data-btn" id="importBtn">import data</button>
    <input type="file" id="importInput" accept="application/json" style="display:none">
  </div>
  <div class="data-status" id="dataStatus"></div>

  <div class="reset-row">
    <button class="reset-btn" id="resetBtn">reset all progress</button>
  </div>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" type="button">&#10005;</button>
    <h3>Fuck up</h3>
    <p class="modal-sub">Optional &mdash; tag what happened. Helps spot patterns later.</p>
    <div class="modal-tags" id="modalTags"></div>
    <textarea class="modal-note" id="modalNote" placeholder="optional note..."></textarea>
    <div class="modal-actions">
      <button class="modal-btn" id="modalSkip" type="button">Log without a tag</button>
      <button class="modal-btn primary" id="modalLog" type="button">Log with tag (&minus;25 XP)</button>
    </div>
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = "time-rpg-state-v3";

  var GOOD_QUESTS = [
    { id: "lift",      label: "Lift weights",              xp: 15, repeatable: false, group: "daily" },
    { id: "cardio",    label: "Cardio",                      xp: 15, repeatable: false, group: "daily" },
    { id: "meditate",  label: "Meditate",                    xp: 15, repeatable: false, group: "daily" },
    { id: "read_bed",  label: "Read before bed",             xp: 15, repeatable: false, group: "daily" },
    { id: "sit_eat",   label: "Sit down to eat",              xp: 5,  repeatable: true, group: "anytime"  },
    { id: "water",     label: "Drink 2 glasses of water",    xp: 5,  repeatable: true, group: "anytime"  },
    { id: "selfless",  label: "Selfless act",                xp: 25, repeatable: true, group: "anytime"  }
  ];

  var BAD_QUESTS = [
    { id: "mindless_eat", label: "Mindless eating",         xp: -10, repeatable: true },
    { id: "processed",    label: "Eating processed food",   xp: -10, repeatable: true },
    { id: "fuckup",        label: "Fuck up",                 xp: -25, repeatable: true, taggable: true }
  ];

  var FUCKUP_TAGS = ["Stress", "Boredom", "Social pressure", "Tiredness", "Habit", "Other"];

  // Linear level curve: level n->n+1 costs 100 + (n-1)*40 XP
  var LEVEL_BASE = 100;
  var LEVEL_STEP = 40;

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function todayKey() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function dateKeyOffset(daysAgo) {
    var d = new Date();
    d.setDate(d.getDate() - daysAgo);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function defaultState() {
    return { totalXp: 0, day: todayKey(), doneToday: {}, log: [], dailyXp: {}, dailyGoodDone: {}, nextLogId: 1 };
  }

  function loadState() {
    var fallback = defaultState();
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return fallback;
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed.totalXp !== "number") return fallback;
      if (!parsed.dailyXp) parsed.dailyXp = {};
      if (!parsed.dailyGoodDone) parsed.dailyGoodDone = {};
      if (!parsed.doneToday) parsed.doneToday = {};
      if (!parsed.log) parsed.log = [];
      if (typeof parsed.nextLogId !== "number") parsed.nextLogId = 1;
      if (parsed.day !== todayKey()) {
        parsed.day = todayKey();
        parsed.doneToday = {};
        parsed.log = [];
      }
      return parsed;
    } catch (e) {
      return fallback;
    }
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  var state = loadState();
  // Only entries logged during THIS page load can be undone — friction against
  // quietly erasing something logged earlier.
  var sessionLogIds = {};

  var dayTag = document.getElementById("dayTag");
  var levelLabel = document.getElementById("levelLabel");
  var xpTotalLabel = document.getElementById("xpTotalLabel");
  var barFill = document.getElementById("barFill");
  var barCurrent = document.getElementById("barCurrent");
  var barToNext = document.getElementById("barToNext");
  var goodDailyGrid = document.getElementById("goodDailyGrid");
  var goodAnytimeGrid = document.getElementById("goodAnytimeGrid");
  var badGrid = document.getElementById("badGrid");
  var logList = document.getElementById("logList");
  var resetBtn = document.getElementById("resetBtn");
  var avgWeekValue = document.getElementById("avgWeekValue");
  var streakPanel = document.getElementById("streakPanel");
  var streakValue = document.getElementById("streakValue");
  var streakCaption = document.getElementById("streakCaption");
  var exportBtn = document.getElementById("exportBtn");
  var importBtn = document.getElementById("importBtn");
  var importInput = document.getElementById("importInput");
  var dataStatus = document.getElementById("dataStatus");

  var modalOverlay = document.getElementById("modalOverlay");
  var modalTags = document.getElementById("modalTags");
  var modalNote = document.getElementById("modalNote");
  var modalSkip = document.getElementById("modalSkip");
  var modalLog = document.getElementById("modalLog");
  var modalClose = document.getElementById("modalClose");
  var selectedTag = null;
  var pendingQuest = null;

  function fmtDay() {
    var d = new Date();
    return d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
  }

  function levelInfo(totalXp) {
    var xp = Math.max(0, totalXp);
    var level = 1, thresh = 0, needed = LEVEL_BASE;
    while (xp >= thresh + needed) {
      thresh += needed;
      level += 1;
      needed += LEVEL_STEP;
    }
    return { level: level, into: xp - thresh, needed: needed };
  }

  function renderStatus() {
    var clampedTotal = Math.max(0, state.totalXp);
    var info = levelInfo(state.totalXp);
    levelLabel.textContent = "Level " + info.level;
    xpTotalLabel.textContent = clampedTotal + " total XP";
    barFill.style.width = (info.into / info.needed * 100) + "%";
    barCurrent.textContent = info.into + " / " + info.needed;
    barToNext.textContent = (info.needed - info.into) + " to next level";
  }

  function renderAverages() {
    var sum = 0;
    for (var i = 0; i < 7; i++) sum += state.dailyXp[dateKeyOffset(i)] || 0;
    avgWeekValue.textContent = Math.round(sum / 7);
  }

  function currentStreak() {
    var streak = 0;
    var startOffset = state.dailyGoodDone[todayKey()] ? 0 : 1;
    for (var i = startOffset; ; i++) {
      if (state.dailyGoodDone[dateKeyOffset(i)]) streak++; else break;
    }
    return streak;
  }

  function renderStreak() {
    var streak = currentStreak();
    streakValue.textContent = streak;
    var doneToday = !!state.dailyGoodDone[todayKey()];
    streakPanel.classList.toggle("broken", streak === 0);
    streakCaption.textContent = doneToday
      ? "good quest logged today"
      : (streak > 0 ? "log a good quest today to keep it going" : "log a good quest to start a streak");
  }

  function addXpToDay(key, xp) {
    state.dailyXp[key] = (state.dailyXp[key] || 0) + xp;
  }

  function logQuest(quest, tag) {
    var key = todayKey();
    state.totalXp += quest.xp;
    state.doneToday[quest.id] = (state.doneToday[quest.id] || 0) + 1;
    addXpToDay(key, quest.xp);
    if (quest.xp > 0) state.dailyGoodDone[key] = true;
    var logId = state.nextLogId++;
    var entry = {
      logId: logId,
      questId: quest.id,
      label: quest.label,
      xp: quest.xp,
      time: new Date().toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })
    };
    if (tag) entry.tag = tag;
    state.log.unshift(entry);
    state.log = state.log.slice(0, 80);
    sessionLogIds[logId] = true;
    saveState();
    renderStatus();
    renderAverages();
    renderStreak();
    renderQuests();
    renderLog();
  }

  function makeQuestButton(quest, kind) {
    var btn = document.createElement("button");
    btn.className = "quest " + kind;
    btn.type = "button";

    var top = document.createElement("div");
    top.className = "quest-top";
    var label = document.createElement("span");
    label.textContent = quest.label;
    var tag = document.createElement("span");
    tag.className = "xp-tag";
    top.appendChild(label);
    top.appendChild(tag);
    btn.appendChild(top);

    var freq = document.createElement("span");
    freq.className = "freq-tag";
    freq.textContent = quest.repeatable ? "anytime, no limit" : "once per day";
    btn.appendChild(freq);

    function refresh() {
      var count = state.doneToday[quest.id] || 0;
      tag.textContent = (quest.xp > 0 ? "+" : "") + quest.xp + " XP";
      btn.classList.toggle("done", count > 0);
      var existing = tag.querySelector(".done-count");
      if (existing) existing.remove();
      if (count > 0) {
        var c = document.createElement("span");
        c.className = "done-count";
        c.textContent = "\u00d7" + count;
        tag.appendChild(c);
      }
      btn.disabled = !quest.repeatable && count > 0;
    }
    refresh();

    btn.addEventListener("click", function () {
      if (quest.taggable) {
        openFuckupModal(quest);
        return;
      }
      logQuest(quest);
    });

    btn._refresh = refresh;
    return btn;
  }

  function renderQuests() {
    goodDailyGrid.innerHTML = "";
    goodAnytimeGrid.innerHTML = "";
    GOOD_QUESTS.forEach(function (q) {
      var target = q.group === "daily" ? goodDailyGrid : goodAnytimeGrid;
      target.appendChild(makeQuestButton(q, "good"));
    });
    badGrid.innerHTML = "";
    BAD_QUESTS.forEach(function (q) { badGrid.appendChild(makeQuestButton(q, "bad")); });
  }

  function openFuckupModal(quest) {
    pendingQuest = quest;
    selectedTag = null;
    modalNote.value = "";
    modalTags.innerHTML = "";
    FUCKUP_TAGS.forEach(function (t) {
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "tag-chip";
      chip.textContent = t;
      chip.addEventListener("click", function () {
        selectedTag = (selectedTag === t) ? null : t;
        Array.prototype.forEach.call(modalTags.children, function (c) {
          c.classList.toggle("selected", c === chip && selectedTag === t);
        });
      });
      modalTags.appendChild(chip);
    });
    modalOverlay.classList.remove("hidden");
  }

  function closeModal() {
    modalOverlay.classList.add("hidden");
    pendingQuest = null;
  }

  function buildTagString() {
    var note = modalNote.value.trim();
    if (selectedTag && note) return selectedTag + ": " + note;
    if (selectedTag) return selectedTag;
    if (note) return note;
    return null;
  }

  modalLog.addEventListener("click", function () {
    if (!pendingQuest) return;
    var tag = buildTagString();
    var q = pendingQuest;
    closeModal();
    logQuest(q, tag);
  });
  modalSkip.addEventListener("click", function () {
    if (!pendingQuest) return;
    var q = pendingQuest;
    closeModal();
    logQuest(q, null);
  });
  modalClose.addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", function (e) {
    if (e.target === modalOverlay) closeModal();
  });

  function undoEntry(logId) {
    if (!sessionLogIds[logId]) return; // friction: only this-session entries are undoable
    if (!confirm("Undo this entry? This can't be redone.")) return;
    var idx = -1;
    for (var i = 0; i < state.log.length; i++) {
      if (state.log[i].logId === logId) { idx = i; break; }
    }
    if (idx === -1) return;
    var entry = state.log[idx];
    state.log.splice(idx, 1);
    state.totalXp -= entry.xp;
    addXpToDay(todayKey(), -entry.xp);
    var count = state.doneToday[entry.questId] || 0;
    if (count <= 1) delete state.doneToday[entry.questId];
    else state.doneToday[entry.questId] = count - 1;
    delete sessionLogIds[logId];
    // Recompute today's good-quest flag from what's left in today's log
    var stillGoodToday = state.log.some(function (e) { return e.xp > 0; });
    if (!stillGoodToday) delete state.dailyGoodDone[todayKey()];
    saveState();
    renderStatus();
    renderAverages();
    renderStreak();
    renderQuests();
    renderLog();
  }

  function renderLog() {
    logList.innerHTML = "";
    if (state.log.length === 0) {
      var li = document.createElement("li");
      li.className = "log-empty";
      li.textContent = "No quests logged yet today.";
      logList.appendChild(li);
      return;
    }
    state.log.forEach(function (entry) {
      var li = document.createElement("li");

      var left = document.createElement("span");
      left.className = "log-left";
      var labelSpan = document.createElement("span");
      labelSpan.className = "log-label";
      labelSpan.textContent = entry.label;
      left.appendChild(labelSpan);
      if (entry.tag) {
        var tagSpan = document.createElement("span");
        tagSpan.className = "log-tag";
        tagSpan.textContent = entry.tag;
        left.appendChild(tagSpan);
      }

      var right = document.createElement("span");
      right.className = "log-right";
      var xpSpan = document.createElement("span");
      xpSpan.className = "log-xp " + (entry.xp >= 0 ? "pos" : "neg");
      xpSpan.textContent = (entry.xp > 0 ? "+" : "") + entry.xp;
      var timeSpan = document.createElement("span");
      timeSpan.className = "log-time";
      timeSpan.textContent = entry.time;
      var undoBtn = document.createElement("button");
      undoBtn.className = "undo-btn";
      undoBtn.type = "button";
      undoBtn.textContent = "undo";
      var canUndo = !!sessionLogIds[entry.logId];
      undoBtn.disabled = !canUndo;
      undoBtn.title = canUndo ? "" : "only quests logged this session can be undone";
      undoBtn.addEventListener("click", function () { undoEntry(entry.logId); });

      right.appendChild(xpSpan);
      right.appendChild(timeSpan);
      right.appendChild(undoBtn);

      li.appendChild(left);
      li.appendChild(right);
      logList.appendChild(li);
    });
  }

  resetBtn.addEventListener("click", function () {
    if (!confirm("Reset all XP, history, and today's log? This can't be undone.")) return;
    state = defaultState();
    sessionLogIds = {};
    saveState();
    renderStatus();
    renderAverages();
    renderStreak();
    renderQuests();
    renderLog();
  });

  function setDataStatus(msg) {
    dataStatus.textContent = msg;
    setTimeout(function () {
      if (dataStatus.textContent === msg) dataStatus.textContent = "";
    }, 4000);
  }

  exportBtn.addEventListener("click", function () {
    var payload = JSON.stringify(state, null, 2);
    var filename = "tim-e-rpg-backup-" + todayKey() + ".json";
    (async function () {
      try {
        var downloads = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null;
        if (downloads) {
          try {
            await downloads.save({ filename: filename, data: payload });
            setDataStatus("Backup saved.");
            return;
          } catch (err) {
            if (err && err.code === "declined") { setDataStatus("Export cancelled."); return; }
            // fall through to browser fallback on other errors
          }
        }
      } catch (e) { /* capability unavailable, fall through */ }
      try {
        var blob = new Blob([payload], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setDataStatus("Backup downloaded.");
      } catch (e2) {
        setDataStatus("Couldn't export data in this view.");
      }
    })();
  });

  importBtn.addEventListener("click", function () { importInput.click(); });
  importInput.addEventListener("change", function () {
    var file = importInput.files && importInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        if (!parsed || typeof parsed.totalXp !== "number") throw new Error("bad shape");
        if (!confirm("Import this backup? It will replace your current data.")) { importInput.value = ""; return; }
        if (!parsed.dailyXp) parsed.dailyXp = {};
        if (!parsed.dailyGoodDone) parsed.dailyGoodDone = {};
        if (!parsed.doneToday) parsed.doneToday = {};
        if (!parsed.log) parsed.log = [];
        if (typeof parsed.nextLogId !== "number") parsed.nextLogId = 1;
        if (parsed.day !== todayKey()) {
          parsed.day = todayKey();
          parsed.doneToday = {};
          parsed.log = [];
        }
        state = parsed;
        sessionLogIds = {};
        saveState();
        renderStatus();
        renderAverages();
        renderStreak();
        renderQuests();
        renderLog();
        setDataStatus("Backup imported.");
      } catch (e) {
        setDataStatus("That file doesn't look like a Tim-e RPG backup.");
      }
      importInput.value = "";
    };
    reader.readAsText(file);
  });

  dayTag.textContent = fmtDay();
  renderStatus();
  renderAverages();
  renderStreak();
  renderQuests();
  renderLog();
})();
</script>
</body>
</html>
